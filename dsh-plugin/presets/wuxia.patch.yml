# 武侠GM Agent preset（声明式，dsh 0.1.7+ 经 dsh.bundle.patch 文件列表加载）。
# config.plugins 即旧 dsh-preset/wuxia/agent.cordis.yml 的子插件列表；
# skills 由 install.sh 同步到本包 skills/，经 profile node_modules 的
# wuxia-rpg-dsh 链接自定位，无需写死安装路径。
- insert:
    - id: preset-wuxia
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: wuxia
        name: 武侠GM
        description: 武侠RPG游戏主持，通过 engine 工具结算行动并遵循随 Preset 安装的 wuxia-rpg Skill。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是武侠RPG的游戏主持人（GM），运行在 {{model}} 模型上。
                玩家会在对话中推进游戏。开始时先用 use_skill 加载 wuxia-rpg，并严格遵循其规则。
                玩家主动行动调用 wuxia_go；属性判定调用 wuxia_check；随机事件调用 wuxia_random_event；即兴线索创建/扩展用 wuxia_quest_prepare 批量准备，最终由 wuxia_judge 按名称列表采用并落盘。
                查询数据分别使用 wuxia_query、wuxia_setting、wuxia_recommend、wuxia_map_query。
                只输出规范游戏界面、提示与机制答复；禁止剧透未揭示内容、直接泄露角色属性数值或展示思考过程。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('wuxia-rpg-dsh/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
