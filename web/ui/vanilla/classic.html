<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>武侠 · 江湖</title>
<style>
  :root{
    --bg:#0f0d0a; --panel:#1a1612; --panel2:#221c16; --ink:#e8dcc4; --ink-dim:#9a8c6e;
    --accent:#c8a456; --accent2:#8a6a2a; --me:#2b2018; --you:#3a2a1e;
    --border:#3a2f22; --danger:#c45a4a; --ok:#7a9a5a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:12px 18px;
    background:linear-gradient(180deg,#1f1812,#15110d);
    border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  header .seal{
    width:34px;height:34px;border-radius:6px;flex:0 0 auto;
    background:linear-gradient(135deg,#a83232,#7a1f1f);
    display:flex;align-items:center;justify-content:center;color:#f3e3c0;
    font-weight:700;font-size:18px;box-shadow:0 0 0 1px #5a1414 inset;
  }
  header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:2px}
  header .sub{font-size:12px;color:var(--ink-dim);margin-left:4px}
  header .spacer{flex:1}
  header button{
    background:transparent;color:var(--ink-dim);border:1px solid var(--border);
    padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;
  }
  header button:hover{color:var(--accent);border-color:var(--accent2)}

  #messages{
    flex:1 1 auto; overflow-y:auto; padding:20px 0; scroll-behavior:smooth;
  }
  #messages:empty::before{
    content:"江湖未启，落笔开篇"; display:block; text-align:center;
    color:var(--ink-dim); margin-top:30vh; font-size:15px; letter-spacing:4px;
  }
  .row{max-width:860px;margin:0 auto;padding:10px 18px;display:flex;gap:12px}
  .row.user{flex-direction:row-reverse}
  .avatar{
    flex:0 0 auto;width:32px;height:32px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    background:var(--you);color:var(--accent);
  }
  .row.assistant .avatar{background:#2a2233;color:#b9a6e0}
  .bubble{
    max-width:78%;padding:11px 15px;border-radius:10px;font-size:15px;
    line-height:1.5;word-break:break-word;border:1px solid var(--border);
  }
  .row.user .bubble{background:var(--you);border-color:#4a3526;white-space:pre-wrap}
  .row.assistant .bubble{background:var(--panel)}
  .bubble strong{color:var(--accent);font-weight:600}
  .bubble em{color:#d9c79a;font-style:normal}
  .bubble a{color:var(--accent)}
  .bubble code{background:#0c0a07;padding:1px 5px;border-radius:3px;color:var(--accent);
    font-family:"SFMono-Regular",Consolas,monospace}
  .bubble .tools{
    display:block;margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;
  }
  .bubble .tool{
    display:inline-block;font-size:12px;color:var(--ink-dim);
    border:1px dashed var(--border);border-radius:4px;padding:1px 7px;
  }
  /* markdown 块级元素 */
  .bubble .md p{margin:0 0 8px}
  .bubble .md p:last-child{margin-bottom:0}
  .bubble .md h1,.bubble .md h2,.bubble .md h3,.bubble .md h4,.bubble .md h5,.bubble .md h6{
    color:var(--accent);font-weight:600;margin:12px 0 6px;line-height:1.4}
  .bubble .md h1{font-size:1.3em}.bubble .md h2{font-size:1.18em}
  .bubble .md h3{font-size:1.08em}.bubble .md h4,.bubble .md h5,.bubble .md h6{font-size:1em}
  .bubble .md ul,.bubble .md ol{margin:4px 0 8px;padding-left:22px}
  .bubble .md li{margin:2px 0}
  .bubble .md blockquote{
    margin:6px 0;padding:2px 12px;border-left:3px solid var(--accent2);
    color:var(--ink-dim)
  }
  .bubble .md hr{border:none;border-top:1px solid var(--border);margin:10px 0}
  .bubble .md pre{
    background:#0c0a07;border:1px solid var(--border);border-radius:6px;
    padding:10px 12px;margin:6px 0;overflow-x:auto
  }
  .bubble .md pre code{background:none;padding:0;color:var(--ink);font-size:13px;line-height:1.6}
  .bubble .md table{border-collapse:collapse;margin:6px 0;font-size:14px;width:auto;max-width:100%}
  .bubble .md th,.bubble .md td{border:1px solid var(--border);padding:4px 10px;text-align:left}
  .bubble .md th{background:var(--panel2);color:var(--accent)}
  .cursor::after{content:"▌";color:var(--accent);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .err{color:var(--danger);display:block}

  footer{
    flex:0 0 auto;border-top:1px solid var(--border);background:var(--panel);
    padding:12px 18px 16px;
  }
  #form{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{
    flex:1;resize:none;min-height:44px;max-height:160px;padding:11px 13px;
    background:var(--panel2);color:var(--ink);border:1px solid var(--border);
    border-radius:9px;font-size:15px;line-height:1.5;font-family:inherit;outline:none;
  }
  textarea:focus{border-color:var(--accent2)}
  #send{
    flex:0 0 auto;height:44px;padding:0 20px;border:none;border-radius:9px;
    background:linear-gradient(180deg,#c8a456,#9a7830);color:#1a1208;
    font-size:15px;font-weight:600;cursor:pointer;
  }
  #send:disabled{opacity:.4;cursor:not-allowed}
  .status{max-width:860px;margin:6px auto 0;color:var(--ink-dim);font-size:12px;min-height:16px}
  .dot{animation:d 1.2s infinite}
  @keyframes d{0%,20%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
  @media(max-width:600px){.bubble{max-width:88%}}
</style>
</head>
<body>
<header>
  <div class="seal">武</div>
  <h1>武侠 · 江湖</h1>
  <span class="sub">与可乐酸橙共赴武林</span>
  <div class="spacer"></div>
  <a href="/ui/vanilla/game" style="margin-right:10px;font-size:12px;color:#8b4513;border:1px solid #8b4513;border-radius:4px;padding:3px 9px;cursor:pointer;user-select:none;letter-spacing:1px" title="切到新版三栏界面">新界面试用 ↗</a>
  <button id="newchat">新对话</button>
</header>

<div id="messages"></div>

<footer>
  <form id="form">
    <textarea id="input" placeholder="落字成令…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
    <button id="send" type="submit">送出</button>
  </form>
  <div class="status" id="status"></div>
</footer>

<script>
const $msgs = document.getElementById('messages');
const $form = document.getElementById('form');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $status = document.getElementById('status');
const $new = document.getElementById('newchat');

// sessionStorage：标签页隔离，互不串话；刷新本标签仍续接，关闭即清。
let sessionId = sessionStorage.getItem('wuxia_sid') || '';
let busy = false;

function closeSession(sid){
  if (!sid) return;
  fetch('/api/session/close', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:sid})
  }).catch(() => {});
}

// 轻量 markdown 渲染（块级 + 内联）。输入原始文本，先转义防注入。
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function render(text){
  if (!text) return '';
  const lines = text.replace(/\r\n/g,'\n').split('\n');
  const out = [];
  let i = 0, para = [];
  const flushPara = () => { if (para.length){ out.push('<p>'+para.map(renderInline).join('<br>')+'</p>'); para = []; } };
  while (i < lines.length){
    let ln = lines[i];
    // 围栏代码块
    const fence = ln.match(/^```(\w*)/);
    if (fence){
      flushPara();
      const lang = fence[1] || '';
      const code = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')){ code.push(lines[i]); i++; }
      i++; // 跳过结束围栏
      out.push('<pre><code class="lang-'+esc(lang)+'">'+esc(code.join('\n'))+'</code></pre>');
      continue;
    }
    // 分隔线
    if (/^\s*([-*_])\1{2,}\s*$/.test(ln)){ flushPara(); out.push('<hr>'); i++; continue; }
    // 标题
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h){ flushPara(); const lvl = h[1].length; out.push('<h'+lvl+'>'+renderInline(h[2])+'</h'+lvl+'>'); i++; continue; }
    // 引用
    if (/^>\s?/.test(ln)){
      flushPara();
      const quote = [];
      while (i < lines.length && /^>\s?/.test(lines[i])){ quote.push(lines[i].replace(/^>\s?/,'')); i++; }
      out.push('<blockquote>'+renderInline(quote.join('\n').replace(/\n/g,'<br>'))+'</blockquote>');
      continue;
    }
    // 无序列表
    if (/^\s*[-*+]\s+/.test(ln)){
      flushPara();
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){ items.push('<li>'+renderInline(lines[i].replace(/^\s*[-*+]\s+/,''))+'</li>'); i++; }
      out.push('<ul>'+items.join('')+'</ul>');
      continue;
    }
    // 有序列表
    if (/^\s*\d+\.\s+/.test(ln)){
      flushPara();
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){ items.push('<li>'+renderInline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>'); i++; }
      out.push('<ol>'+items.join('')+'</ol>');
      continue;
    }
    // 表格（含分隔行）
    if (i+1 < lines.length && /\|/.test(ln) && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])){
      flushPara();
      const rows = [];
      const header = ln.split('|').map(c=>c.trim()).filter(c=>c.length||true).slice(ln.startsWith('|')?1:0, ln.endsWith('|')?-1:undefined);
      i += 2;
      rows.push('<tr>'+header.map(c=>'<th>'+renderInline(c)+'</th>').join('')+'</tr>');
      while (i < lines.length && /\|/.test(lines[i])){
        const cells = lines[i].split('|').slice(ln.startsWith('|')?1:0, ln.endsWith('|')?-1:undefined).map(c=>c.trim());
        rows.push('<tr>'+cells.map(c=>'<td>'+renderInline(c)+'</td>').join('')+'</tr>');
        i++;
      }
      out.push('<table>'+rows.join('')+'</table>');
      continue;
    }
    // 空行 → 段落分隔
    if (!ln.trim()){ flushPara(); i++; continue; }
    // 普通段落
    para.push(ln); i++;
  }
  flushPara();
  return out.join('');
}

function scrollDown(){
  $msgs.scrollTop = $msgs.scrollHeight;
}

function addRow(role, text){
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '侠' : 'GM';
  const bub = document.createElement('div');
  bub.className = 'bubble';
  if (text != null){
    // 用户消息原样转义显示；助手历史直接渲染 markdown
    bub.innerHTML = role === 'user' ? esc(text) : render(text);
  }
  row.appendChild(av); row.appendChild(bub);
  $msgs.appendChild(row);
  scrollDown();
  return bub;
}

function setStatus(t){ $status.innerHTML = t; }

async function send(msg){
  msg = (msg != null ? msg : $input.value).trim();
  if (!msg || busy) return;
  busy = true; $send.disabled = true;
  $input.value=''; $input.style.height='auto';
  addRow('user', msg);
  const bub = addRow('assistant', '');
  bub._segs = [];          // 本回合有序片段，用于落盘与刷新重建
  bub.classList.add('cursor');
  pendingUser = msg;       // done 时连同用户消息一起存
  setStatus('<span class="dot">●</span> 正在运笔…');

  try{
    const resp = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: msg, session_id: sessionId})
    });
    if (!resp.ok){ throw new Error('HTTP ' + resp.status); }

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1){
        const block = buf.slice(0, idx); buf = buf.slice(idx+2);
        handleEvent(block, bub);
      }
    }
  }catch(e){
    bub.innerHTML = '<span class="err">连接失败：' + e.message + '</span>';
  }finally{
    bub.classList.remove('cursor');
    if (!bub.innerHTML.trim()) bub.innerHTML = '<span class="err">（无内容返回）</span>';
    setStatus('');
    saveLog(pendingUser, bub._segs || []);   // 落盘本回合对话
    pendingUser = null;
    busy = false; $send.disabled = false;
    $input.focus();
  }
}

function handleEvent(block, bub){
  // block 形如 "event: xxx\ndata: {...}"
  let evType = '', dataLine = '';
  for (const ln of block.split('\n')){
    if (ln.startsWith('event:')) evType = ln.slice(6).trim();
    else if (ln.startsWith('data:')) dataLine += ln.slice(5).trim();
  }
  if (!dataLine) return;
  let data; try{ data = JSON.parse(dataLine); }catch{ return; }

  if (evType === 'session'){
    sessionId = data.session_id;
    sessionStorage.setItem('wuxia_sid', sessionId);
  } else if (evType === 'delta'){
    appendDelta(bub, data.text);
    scrollDown();
  } else if (evType === 'tool'){
    // 文本→tool：另起一行；连续 tool 复用同一行容器，不换行
    if (bub.childNodes.length && !lastIsTools(bub)) bub.appendChild(document.createTextNode('\n'));
    const group = lastIsTools(bub) ? bub.lastChild : newToolsGroup(bub);
    const t = document.createElement('span');
    t.className = 'tool';
    t.textContent = '◆ 运算：' + data.name;
    group.appendChild(t);
    if (!bub._segs) bub._segs = [];
    bub._segs.push({kind:'tool', name: data.name});
    scrollDown();
  } else if (evType === 'error'){
    const e = document.createElement('span');
    e.className = 'err';
    e.textContent = '[错误] ' + data.message;
    bub.appendChild(e);
  } else if (evType === 'done'){
    if (data.error && data.result){
      const e = document.createElement('span');
      e.className = 'err'; e.textContent = '[未完成] ' + data.result;
      bub.appendChild(e);
    }
  }
}

// 上一个子节点是否为 tool 组（连续 tool 同行显示）
function lastIsTools(bub){
  const last = bub.lastChild;
  return last && last.nodeType === 1 && last.classList && last.classList.contains('tools');
}
// 新建一个 tool 行容器
function newToolsGroup(bub){
  const g = document.createElement('div');
  g.className = 'tools';
  bub.appendChild(g);
  return g;
}
// 为一段文本创建/复用 markdown 容器（.md）
function mdContainer(bub){
  if (lastIsTools(bub) || !bub.lastChild || !bub.lastChild.classList || !bub.lastChild.classList.contains('md')){
    const div = document.createElement('div');
    div.className = 'md';
    bub.appendChild(div);
  }
  return bub.lastChild;
}

let pendingUser = null;

// 流式增量：累积原始文本到末尾 text 段，整体 markdown 重渲染其容器
function appendDelta(bub, text){
  if (!text) return;
  if (!bub._segs) bub._segs = [];
  const last = bub._segs[bub._segs.length - 1];
  if (last && last.kind === 'text') last.text += text;
  else { const seg = {kind:'text', text}; bub._segs.push(seg); pushMd(bub, seg); }
  const seg = bub._segs[bub._segs.length - 1];
  seg._el.innerHTML = render(seg.text);
}
// 新建 text 段对应的 markdown 容器并挂到 seg._el
function pushMd(bub, seg){
  if (lastIsTools(bub)) bub.appendChild(document.createTextNode('\n'));
  seg._el = mdContainer(bub);
}

const LOG_KEY = 'wuxia_log';
function saveLog(userText, segs){
  // 落盘仅保留纯数据（去掉 DOM 引用 _el）
  const clean = segs.map(s => s.kind === 'text' ? {kind:'text', text: s.text} : {kind:'tool', name: s.name});
  try{
    const log = JSON.parse(sessionStorage.getItem(LOG_KEY) || '[]');
    log.push({role:'user', text: userText});
    log.push({role:'assistant', segs: clean});
    sessionStorage.setItem(LOG_KEY, JSON.stringify(log));
  }catch(e){ /* 配额超限等忽略 */ }
}
// 按 segments 重建一个 assistant 气泡（markdown 渲染文本段）
function renderSegs(bub, segs){
  if (!bub._segs) bub._segs = [];
  for (const s of segs){
    if (s.kind === 'text'){
      const seg = {kind:'text', text: s.text};
      bub._segs.push(seg);
      pushMd(bub, seg);
      seg._el.innerHTML = render(seg.text);
    } else if (s.kind === 'tool'){
      if (bub.childNodes.length && !lastIsTools(bub)) bub.appendChild(document.createTextNode('\n'));
      const group = lastIsTools(bub) ? bub.lastChild : newToolsGroup(bub);
      const t = document.createElement('span');
      t.className = 'tool';
      t.textContent = '◆ 运算：' + s.name;
      group.appendChild(t);
      bub._segs.push({kind:'tool', name: s.name});
    }
  }
}
function loadLog(){
  let log;
  try{ log = JSON.parse(sessionStorage.getItem(LOG_KEY) || '[]'); }catch{ log = []; }
  for (const m of log){
    if (m.role === 'user') addRow('user', m.text);
    else { const bub = addRow('assistant', ''); renderSegs(bub, m.segs || []); }
  }
}

$form.addEventListener('submit', e => { e.preventDefault(); send(); });

$input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 160) + 'px';
});

$new.addEventListener('click', () => {
  if (busy) return;
  if (sessionId && !confirm('开新一卷？当前对话将不再续接。')) return;
  closeSession(sessionId);
  sessionId = '';
  sessionStorage.removeItem('wuxia_sid');
  sessionStorage.removeItem(LOG_KEY);
  $msgs.innerHTML = '';
  $input.focus();
});

loadLog();      // 刷新后按 sessionStorage 重建历史对话
$input.focus();

// 新标签/新页面且无历史时，自动开局
if (!sessionId && !$msgs.children.length){
  send('开始游戏');
}
</script>
</body>
</html>
