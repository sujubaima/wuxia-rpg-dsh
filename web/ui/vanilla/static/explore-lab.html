<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游历试炼场（隐藏测试入口）</title>
<style>
  :root{
    --bg:#0f0d0a; --panel:#1a1612; --panel2:#221c16; --ink:#e8dcc4; --ink-dim:#9a8c6e;
    --accent:#c8a456; --accent2:#8a6a2a; --border:#3a2f22; --danger:#c45a4a; --ok:#7a9a5a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;padding:40px 16px}
  .wrap{max-width:680px;width:100%}
  h1{font-size:19px;color:var(--accent);letter-spacing:6px;margin:0 0 4px;text-align:center}
  .sub{font-size:12px;color:var(--ink-dim);text-align:center;letter-spacing:2px;margin-bottom:24px}
  .note{font-size:12px;color:var(--ink-dim);line-height:1.9;border:1px dashed var(--border);
    border-radius:7px;padding:8px 14px;margin:14px 0}
  .note b{color:var(--accent);font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:16px 18px;margin:12px 0}
  .row{display:flex;gap:12px;align-items:center;margin:12px 0;flex-wrap:wrap}
  .row label{font-size:13px;color:var(--ink-dim);min-width:76px}
  select,input[type=text]{appearance:none;-webkit-appearance:none;cursor:pointer;font-family:inherit;font-size:13px;
    color:var(--ink);background:#0c0a07;border:1px solid var(--border);border-radius:5px;padding:7px 10px;flex:1}
  .go{width:100%;padding:12px;border:none;border-radius:9px;margin-top:16px;
    background:linear-gradient(180deg,#c8a456,#9a7830);color:#1a1208;font-size:15px;font-weight:600;
    cursor:pointer;letter-spacing:4px}
  .go:disabled{opacity:.45;cursor:not-allowed}
  .wipe{width:100%;padding:9px;border:1px solid #6a3a34;border-radius:9px;margin-top:8px;background:var(--panel2);
    color:var(--danger);font-size:13px;cursor:pointer;letter-spacing:2px;display:none}
  #status{font-size:12.5px;color:var(--ok);margin-top:10px;min-height:18px;text-align:center}
  #status.err{color:var(--danger)}
  .back{display:inline-block;margin-top:16px;color:var(--ink-dim);font-size:12.5px;letter-spacing:1px}
  .back:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>历 练 场</h1>
  <div class="sub">隐藏测试入口 · 跳过建档/读档，直接进入大世界游历</div>
  <div class="note">
    以<b>预设角色「名·试」分身</b>建独立测试档（避免基线重名红线），引擎随机落点、GM 现写开场。
    开场以后照常经 LLM 驱动游历（场景罗盘/要素/队伍栏全链路）。收尾清档一键删测试档，零残留。
  </div>

  <div class="panel">
    <div class="row"><label>主控预设</label><select id="charSel"></select></div>
    <div class="row"><label>场景提示</label>
      <input type="text" id="scenario" placeholder="例：雨夜城郊小酒馆（留空=GM 随机发挥）" />
    </div>
    <div class="row" style="font-size:11.5px;color:var(--ink-dim)">
      <span id="slotNote">测试档未建仓</span>
    </div>
  </div>

  <button class="go" id="goBtn">开 始 游 历 测 试</button>
  <button class="wipe" id="wipeBtn">收 尾 清 档（删除测试档全部数据）</button>
  <div id="status"></div>
  <div style="text-align:center"><a class="back" href="/game">↩ 回主界面</a></div>
</div>

<script>
let TEST_SLOT=0, presetList=[];
// 跳转目标：?to=/ui 跳 React 版，缺省 /game 跳原版。
const TO=new URLSearchParams(location.search).get('to')||'/game';
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const $=id=>document.getElementById(id);
function setStatus(t,err){const s=$('status');s.textContent=t||'';s.className=err?'err':'';}

async function engineGo(actions,slot){
  const resp=await fetch('/api/engine',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({"槽位":slot!=null?slot:1,"行为":actions})});
  const d=await resp.json().catch(()=>({"错误":"响应非 JSON"}));
  if(d.error&&!d.错误)d.错误=d.error;
  return d;
}

async function loadPresets(){
  try{
    const r=await fetch('/api/presets');
    presetList=await r.json();
  }catch(e){setStatus('预设列表读取失败：'+e.message,true);return;}
  const sel=$('charSel');sel.innerHTML='';
  for(const p of presetList){
    const o=el('option');
    o.value=p.名称;
    o.textContent=`${p.名称}｜${p.阵营}｜${p.性别||''}｜${p.年龄||''}岁`;
    sel.appendChild(o);
  }
}

/* 测试档：角色名 = 预设名·试（避开基线重名），有则复用 */
async function ensureTestSlot(presetName){
  const cloneName=presetName+'·试';
  const all=await engineGo([{"类型":"开始游戏"}]);
  const found=(all.存档列表||[]).find(s=>(s.角色名||'')===cloneName);
  if(found){TEST_SLOT=found.slot;return cloneName;}
  const pr=await fetch('/api/preset/'+encodeURIComponent(presetName));
  const d=await pr.json().catch(()=>({"错误":"响应非 JSON"}));
  if(d.错误||d.error){throw new Error('预设档案读取失败：'+(d.错误||d.error));}
  const clone={...d};
  delete clone.id;delete clone.死亡;delete clone.关系度;delete clone.经验值;
  clone.名称=cloneName;
  const c=await engineGo([{"类型":"创建角色","角色":clone}]);
  if(c.错误)throw new Error('建档失败：'+c.错误);
  TEST_SLOT=(c.结算||[]).find(x=>x.新建slot)?.新建slot||0;
  if(!TEST_SLOT)throw new Error('建档回执未带新建slot');
  return cloneName;
}

$('goBtn').onclick=async()=>{
  const preset=$('charSel').value;
  if(!preset)return setStatus('请选预设角色',true);
  $('goBtn').disabled=true;setStatus('建仓/建档中…');
  try{
    const cloneName=await ensureTestSlot(preset);
    $('slotNote').textContent=`测试档 slot ${TEST_SLOT}（角色「${cloneName}」）`;
    setStatus('交送 GM 铺开场…（LLM 一次调出探索状态，约十数秒）');
    const scenario=$('scenario').value.trim();
    const directive=
      `【测试游历 · 直接接入大世界会话】\n`+
      `玩家经隐藏测试入口要求跳过建档/读档流程，直接进入大世界游历测试。本次会话中一切 engine go/judge 的槽位一律用 ${TEST_SLOT}（测试档「${cloneName}」）。\n`+
      `请立即按既定游戏会话动作进行初始化：\n`+
      `1) engine go 返回游戏 读出身位；\n`+
      `2) 随即 engine judge 顶层 当前剧情=开场一段剧情（2-4 句，符合落点风土、带一处剧情引子${scenario?`（玩家给出的场景提示：${scenario}）`:''}）、场景要素 3-5 行、经历概括一行，同时 登记场景（该地点周边两三处邻接地点并给方位出口）；\n`+
      `3) 此后均按正常游戏规则读玩家的游历指令。\n`+
      `本条本身是测试引导指令，按 wuxia-rpg 会话纪律执行。`;
    const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:directive,session_id:sessionStorage.getItem('wuxia_sid')||''})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    /* 解析 SSE：拿会话 id（新会话写回）；收到首个 state（exploration-ui 首屏已落盘）即跳转，
       不必等 LLM 把整段开场跑完——/game 冷启经 返回游戏 读盘回放已落盘的首屏。
       中断剩余 SSE 流，后台 LLM 若仍在跑，其后续落盘 /game 下次刷新自然可见。 */
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';let newSid='';let jumped=false;
    function goJump(){
      if(jumped)return;jumped=true;
      if(newSid)sessionStorage.setItem('wuxia_sid',newSid);
      sessionStorage.setItem('wuxia_newui_slot',String(TEST_SLOT));
      setStatus('GM 已铺开场。跳回主界面…');
      $('wipeBtn').style.display='block';
      reader.cancel().catch(()=>{});   // 中断剩余 SSE
      setTimeout(()=>location.href=TO,500);
    }
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let idx;
      while((idx=buf.indexOf('\n\n'))!==-1){
        const block=buf.slice(0,idx);buf=buf.slice(idx+2);
        let ev='',data='';
        for(const ln of block.split('\n')){
          if(ln.startsWith('event:'))ev=ln.slice(6).trim();
          else if(ln.startsWith('data:'))data+=ln.slice(5).trim();
        }
        if(!data)continue;
        try{const dd=JSON.parse(data);
          if(ev==='session'&&dd.session_id)newSid=dd.session_id;
          if(ev==='state'&&dd.界面==='exploration-ui'){goJump();}   // 首屏落盘即跳
        }catch(e){}
      }
    }
    goJump();   // 兜底：SSE 正常结束仍未跳（如首屏 state 未到）则跳
    setTimeout(()=>location.href=TO,900);
  }catch(e){setStatus(String(e.message||e),true);}
  finally{$('goBtn').disabled=false;}
};

$('wipeBtn').onclick=async()=>{
  if(!TEST_SLOT)return setStatus('无测试档',true);
  if(!confirm('删除测试档 slot '+TEST_SLOT+' 全部数据（角色/场景/剧情一并丢弃）？'))return;
  try{
    const r=await engineGo([{"类型":"删除存档","槽位":TEST_SLOT}],TEST_SLOT);
    const ok=r['结算']&&r['结算'].some(x=>x.ok);
    setStatus(ok?'测试档已清空。':'清档回执异常：'+JSON.stringify(r.结算||r.错误),ok?false:true);
    if(ok){$('wipeBtn').style.display='none';TEST_SLOT=0;$('slotNote').textContent='测试档已删';}
  }catch(e){setStatus('清档失败：'+e.message,true);}
};

loadPresets();
</script>
</body>
</html>
